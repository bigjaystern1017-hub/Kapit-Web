kind = "web"
previewPath = "/kapit-web/"
title = "Kapit Web"
version = "1.0.0"
id = "artifacts/kapit-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/kapit-web/" ]
localPort = 20085

[services.development]
run = "pnpm --filter @workspace/kapit-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kapit-web", "run", "build" ]
publicDir = "artifacts/kapit-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20085"
BASE_PATH = "/kapit-web/"
